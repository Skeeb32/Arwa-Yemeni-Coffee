<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Arwa · Order desk</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="ordering.css"><style>main{max-width:1000px;margin:auto;padding:50px 25px}h1{font-size:55px}form{display:flex;gap:15px;margin:30px 0}input{padding:14px;border:1px solid #bda78e;flex:1;min-width:0;background:#fff9ef}.staff-order{padding:25px;border:1px solid #bda78e;margin:20px 0}.staff-order p{font-size:13px;line-height:1.7}.staff-order h2{font-size:30px;letter-spacing:-1px}.staff-order button{margin-top:15px}#staff-message{font-size:13px;line-height:1.7}.toolbar{display:flex;gap:20px;align-items:center}</style><script src="staff.js" defer></script></head><body><main><p class="eyebrow">ARWA / ORDER DESK</p><h1>Today’s moments.</h1><p>Paid orders and fulfillment updates. Sign in with your private staff access key.</p><form id="staff-login"><label for="staff-key" class="skip">Staff access key</label><input id="staff-key" type="password" autocomplete="off" placeholder="Staff access key" required><button class="button dark">Open order desk</button></form><div class="toolbar" hidden id="staff-toolbar"><button class="text-button" id="staff-refresh">Refresh orders</button><button class="text-button" id="staff-signout">Sign out</button></div><p id="staff-message" role="status"></p><div id="staff-orders"></div></main></body></html>
